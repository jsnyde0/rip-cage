# Per-project rip-cage config for the rip-cage repo itself — RETIRED SCHEMA.
# Composed 2026-07-14 as a live dogfood of the configure-cage skill (rip-cage-tsf2.3).
# This is the pre-ADR-031 v2 `.rip-cage.yaml` schema (merged with a global
# ~/.config/rip-cage/config.yaml). rc no longer reads it: a cage now launches
# from one native msb config at ~/.config/rip-cage/projects/<cage>.yaml
# (ADR-031 D2). The file is a historical record; editing it changes no cage.
#
# Credentials, in the current shape: claude rides msb `secrets:` (CCTOK), and
# pi rides msb `secrets:` too — no host ~/.pi/agent/auth.json is mounted
# (ADR-019 D1, ADR-019 D5). The cage-config skill's pi-providers recipe holds
# the lines. The hosts below were the openai-codex provider hosts.
version: 2
network:
  allowed_hosts:
    # pi is pinned to openai-codex/gpt-5.5 (tools.yaml pi-recipe launch_args) —
    # the ChatGPT-account codex login path. These are its known provider hosts;
    # the deny loop confirms/extends the exact set during probes.
    - chatgpt.com
    - auth.openai.com
