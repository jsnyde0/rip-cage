version: 1
tools:
  # Combined fixture: tmux + herdr MULTIPLEXER providers for lifecycle testing.
  # Used by test-multiplexer-lifecycle.sh (rip-cage-61al.3).
  #
  # claude-recipe (TOOL): bakes /usr/local/bin/claude (the session-isolation
  # wrapper) + managed-settings floor-lock + cage-topology doc. Copied verbatim
  # from examples/claude/manifest-fragment.yaml (rip-cage-uc8b / rip-cage-xnc5
  # triage: the (d) config-isolation p1p probe's Step 0 asserts `which claude`
  # resolves to /usr/local/bin/claude — this fixture omitted the recipe, so the
  # wrapper was never baked and the probe failed at its very first check before
  # any of its live-claude-auth assertions could even run).
  - name: claude-recipe
    archetype: TOOL
    version_pin: "bundled-recipe"
    install_cmd: ": && mkdir -p /etc/rip-cage && echo '' | base64 -d > /usr/local/bin/claude && chown root:root /usr/local/bin/claude && chmod 0755 /usr/local/bin/claude && mkdir -p /etc/claude-code && chown root:root /etc/claude-code && chmod 0755 /etc/claude-code && echo '' | base64 -d > /etc/claude-code/managed-settings.json && chown root:root /etc/claude-code/managed-settings.json && chmod 0644 /etc/claude-code/managed-settings.json && echo '' | base64 -d > /etc/rip-cage/cage-claude.md && chown root:root /etc/rip-cage/cage-claude.md && chmod 0644 /etc/rip-cage/cage-claude.md"
    egress: []
    mounts: []

  # Two entries for tmux: the TOOL entry installs the binary; the MULTIPLEXER entry
  # provides dispatch hooks. tmux is no longer baked in the base image (ADR-005 D12).
  - name: tmux-bin
    archetype: TOOL
    version_pin: "3.4-debian"
    install_cmd: "apt-get install -y --no-install-recommends tmux"
    egress: []
    mounts: []
  - name: tmux
    archetype: MULTIPLEXER
    version_pin: "bundled"
    hooks:
      start: "tmux new-session -d -s rip-cage -c /workspace 2>/dev/null || true"
      attach: "tmux attach-session -t rip-cage 2>/dev/null || (tmux new-session -d -s rip-cage -c /workspace && tmux attach-session -t rip-cage)"
      new_session: "NEW=$(tmux list-sessions -F '#{session_name}' 2>/dev/null | awk 'BEGIN{n=2} /^rip-cage-[0-9]+$/{x=substr($0,10)+0; if(x>=n) n=x+1} END{print \"rip-cage-\" n}') && tmux new-session -d -s \"$NEW\" -c /workspace && tmux attach-session -t \"$NEW\""
  # herdr: TOOL entry installs the binary; MULTIPLEXER entry provides dispatch hooks.
  - name: herdr-bin
    archetype: TOOL
    version_pin: "v0.6.10"
    install_cmd: "ARCH=$(uname -m) && if [ \"$ARCH\" = \"aarch64\" ]; then TARGET=aarch64; EXPECTED_SHA=b3144a41df364f0541bbbdfe840fa61dbd67daf6e313ee317fe495d2ccf4927a; else TARGET=x86_64; EXPECTED_SHA=78d298d5a1ef076b4607e8e3c92d98f5de9f0cb30daf31aa910a1a6e9abb4fa1; fi && curl -fsSL \"https://github.com/ogulcancelik/herdr/releases/download/v0.6.10/herdr-linux-${TARGET}\" -o /tmp/herdr && echo \"${EXPECTED_SHA}  /tmp/herdr\" | sha256sum -c - && install -m 755 /tmp/herdr /usr/local/bin/herdr && rm -f /tmp/herdr"
    egress:
      - github.com
    mounts: []
  - name: herdr
    archetype: MULTIPLEXER
    version_pin: "bundled"
    hooks:
      start: "mkdir -p \"${HOME}/.config/herdr\" && herdr server > /tmp/rip-cage-mux-herdr.log 2>&1 & echo \"[rip-cage] herdr server started (PID=$!)\" && sleep 1 && for _agent in pi claude; do if command -v \"${_agent}\" > /dev/null 2>&1; then _out=$(herdr integration install \"${_agent}\" 2>&1); _rc=$?; if [ \"$_rc\" -eq 0 ]; then echo \"[rip-cage] herdr integration installed: ${_agent}\"; else echo \"[rip-cage] WARNING: herdr integration install ${_agent} failed\" >&2; fi; fi; done"
      attach: "herdr"
  # pi-recipe (TOOL): creates ~/.pi/agent/extensions/ (agent-writable) at boot,
  # via a TOOL init hook. Copied verbatim from examples/pi/manifest-fragment.yaml
  # (rip-cage-uc8b item 2 empirical finding): the herdr MULTIPLEXER start hook
  # above unconditionally runs `herdr integration install pi` at every boot
  # (examples/herdr/manifest-fragment.yaml pattern) — without this recipe,
  # ~/.pi/agent/extensions/ never exists, so that install silently WARNs and
  # fails every boot with "extension directory not found" (the exact
  # rip-cage-fwp3 symptom, live-reproduced here: 'rc up' printed "WARNING:
  # herdr integration install pi failed"), so pi's herdr-agent-state.ts
  # extension (the ADR-006 D8 semantic-status integration) never installs.
  - name: pi-recipe
    archetype: TOOL
    version_pin: "bundled-recipe"
    init: '_rc_pi_ext_dir="${PI_CODING_AGENT_DIR:-/home/agent/.pi/agent}/extensions"; if ! mkdir -p "$_rc_pi_ext_dir" 2>/tmp/rc-pi-ext-mkdir-err; then echo "[rip-cage] WARNING: could not create ${_rc_pi_ext_dir} (herdr''s boot-time ''integration install pi'' will fail with ''extension directory not found'', rip-cage-fwp3): $(cat /tmp/rc-pi-ext-mkdir-err 2>/dev/null)" >&2; fi; rm -f /tmp/rc-pi-ext-mkdir-err; true'
    install_cmd: ": && mkdir -p /etc/rip-cage/pi /etc/rip-cage && echo '' | base64 -d > /etc/rip-cage/cage-pi.md && chown root:root /etc/rip-cage/cage-pi.md && chmod 0644 /etc/rip-cage/cage-pi.md"
    egress: []
    mounts: []
